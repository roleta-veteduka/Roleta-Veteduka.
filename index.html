<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roleta de Desconto — VeteduKa</title>
<style>
:root{--navy:#1b2a4a;--orange:#f26b1d;--white:#fff;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:var(--white);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px));text-align:center;overflow-x:hidden}
.brand{font-weight:800;letter-spacing:.12em;font-size:1.1rem}
.brand span{color:var(--orange)}
h1{margin:6px 0 4px;font-size:1.7rem}
p.s{margin:0 0 18px;opacity:.85}
.stage{position:relative;width:min(86vw,340px);aspect-ratio:1}
.ring{position:absolute;inset:-10px;border-radius:50%;background:var(--white);box-shadow:0 8px 30px rgba(0,0,0,.4)}
canvas{position:relative;width:100%;height:100%;border-radius:50%;transition:transform 5.5s cubic-bezier(.12,.6,.1,1)}
.ptr{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--orange);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));z-index:3}
#go{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:5px solid var(--white);background:var(--orange);color:var(--white);font:800 1rem/1 inherit;cursor:pointer;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#go:disabled{background:var(--navy);cursor:default}
#res{margin-top:34px;min-height:110px;max-width:420px}
.big{font-size:3rem;font-weight:900;color:var(--orange);line-height:1}
.card{background:var(--white);color:var(--navy);border-radius:16px;padding:14px 18px}
.card b{display:block;font-size:1.05rem}
.hint{opacity:.8;font-size:.9rem;margin-top:12px}
.rs{margin-top:18px;background:none;border:0;color:var(--white);opacity:.25;font-size:.75rem;cursor:pointer}
</style>
</head>
<body>
<div class="brand">VETE<span>DUKA</span></div>
<h1>Antecipa Black 🎁</h1>
<p class="s" id="info">Descubra sua condição especial para a Pós-Graduação VeteduKa!</p>
<div class="stage"><div class="ring"></div><div class="ptr"></div><canvas id="c" width="680" height="680"></canvas><button id="go">GIRAR</button></div>
<div id="res"></div><div class="hint">🎓 Fechando a Pós-Graduação, você também ganha o Curso Plantonista!</div>
<button class="rs" id="rs" style="display:none">reiniciar</button>
<script>
// Resultados fixos por rodada: 1º giro = 40%, 2º = 20%, 3º = 15%
const SEG=[40,20,15,40,20,15,40,20];
const RESULTADOS=[40,20,15];
const KEY='roleta_veteduka_antecipa_black_v1';
const KEY='roleta_veteduka_v2';
const cv=document.getElementById('c'),x=cv.getContext('2d'),go=document.getElementById('go'),res=document.getElementById('res');
const N=SEG.length,A=2*Math.PI/N,R=340;
SEG.forEach((v,i)=>{
  const a0=-Math.PI/2+i*A;
  x.beginPath();x.moveTo(R,R);x.arc(R,R,R,a0,a0+A);x.closePath();
  x.fillStyle=i%2?'#f26b1d':'#1b2a4a';x.fill();
  x.lineWidth=4;x.strokeStyle='#fff';x.stroke();
  x.save();x.translate(R,R);x.rotate(a0+A/2);
  x.fillStyle='#fff';x.font='bold 64px system-ui,sans-serif';x.textAlign='right';x.textBaseline='middle';
  x.fillText(v+'%',R-40,0);x.restore();
});
function pick(){
  return RESULTADOS[hist.length];
}
const MAX=3,info=document.getElementById('info');
let hist=[];try{hist=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let rot=0,busy=false;
function render(){
  const left=MAX-hist.length;
  info.innerHTML=left>0?`Giros restantes: <b>${left}</b> · cada rodada libera uma condição especial 🎁`:'Giros esgotados';
  go.disabled=left<=0||busy;go.textContent=left>0?'GIRAR':'FIM';
  if(!hist.length){res.innerHTML='';return}
  const best=Math.max(...hist);
  const lista=hist.map((v,k)=>`${k+1}º giro: ${v}%`).join(' · ');
  res.innerHTML=`<div class="big">${best}%</div><div class="card" style="margin-top:10px"><b>${left>0?`Você ganhou ${best}% na Pós-Graduação! Ainda tem ${left} giro(s) para descobrir a próxima condição.`:`Parabéns! Sua condição final é ${best}% de desconto na Pós-Graduação + Curso Plantonista de presente! 🎉`}</b>${lista}${left>0?'':'<br>Envie um print desta tela para a sua consultora e garanta o seu desconto.'}</div>`;
}
render();
go.onclick=()=>{
  if(busy||hist.length>=MAX)return;busy=true;go.disabled=true;
  const v=pick();
  const idx=SEG.map((s,i)=>s===v?i:-1).filter(i=>i>=0);
  const i=idx[Math.floor(Math.random()*idx.length)];
  const jitter=(Math.random()-.5)*(360/N)*.7;
  const target=((360-(i*(360/N)+(360/N)/2)+jitter)%360+360)%360;
  const delta=((target-rot%360)+360)%360;
  rot+=360*6+delta;
  cv.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{busy=false;hist.push(v);try{localStorage.setItem(KEY,JSON.stringify(hist))}catch(e){}render()},5700);
};
document.getElementById('rs').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
</script>
</body>
</html>
